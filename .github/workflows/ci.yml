name: iOS CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  core:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test API and domain layer
        run: swift test

  app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Select a simulator
        id: simulator
        run: |
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; compatible=[xs for r,xs in d.items() if r.endswith("iOS-18-5")]; pools=compatible or list(d.values()); print(next(x["udid"] for xs in pools for x in xs if x["name"].startswith("iPhone 16")))')
          echo "id=$device" >> "$GITHUB_OUTPUT"
      - name: Compile app and test bundles
        run: >-
          xcodebuild build-for-testing
          -project Audio2MIDI.xcodeproj
          -scheme Audio2MIDI
          -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}"
          -derivedDataPath DerivedData
          CODE_SIGNING_ALLOWED=NO
      - name: Run fixture UI tests
        timeout-minutes: 5
        run: >-
          xcodebuild test-without-building
          -project Audio2MIDI.xcodeproj
          -scheme Audio2MIDI
          -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}"
          -derivedDataPath DerivedData
          -resultBundlePath DerivedData/TestResults.xcresult
          -test-timeouts-enabled YES
          -default-test-execution-time-allowance 30
          -maximum-test-execution-time-allowance 60
          CODE_SIGNING_ALLOWED=NO
      - name: Export visual snapshots
        if: always()
        run: xcrun xcresulttool export attachments --path DerivedData/TestResults.xcresult --output-path Screenshots
      - name: Upload test result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: |
            DerivedData/TestResults.xcresult
            Screenshots
